<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Houtsoorten Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Houtsoorten Quiz</h1>

    <!-- Score en highscore -->
    <div class="score-container">
      <h2 id="streak">Streak: 0</h2>
      <h2 id="highscore">Highscore: 0</h2>
    </div>

    <!-- Gamemode buttons -->
    <div id="modes">
      <button onclick="setMode('name')">Naam → Foto</button>
      <button onclick="setMode('uses')">Toepassingen → Foto</button>
    </div>

    <!-- Houtvraag -->
    <h1 id="wood-name"></h1>
    <p id="feedback"></p>
    <p id="wood-info"></p>


    <!-- Foto opties -->
    <div id="grid" class="grid"></div>

    <!-- Volgende knop -->
    <button id="next-btn" onclick="nextQuestion()">Volgende</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
